<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App - OpenFlex Neo MXML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Neo Component Styles */
        .neo-application {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neo-vbox {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .neo-vbox.h-align-center {
            align-items: center;
        }

        .neo-vbox.v-align-middle {
            justify-content: center;
        }

        .neo-hbox {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
        }

        .neo-hbox.h-align-center {
            justify-content: center;
        }

        .neo-panel {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            min-width: 500px;
            max-width: 600px;
        }

        .neo-panel-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .neo-panel-body {
            padding: 30px;
        }

        .neo-label {
            font-size: 16px;
            color: #333;
        }

        .neo-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .neo-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
        }

        .neo-button:active {
            transform: translateY(0);
        }

        .neo-textinput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .neo-textinput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .neo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .neo-repeater {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .repeater-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .repeater-item:hover {
            background: #e9ecef;
            transform: translateX(4px);
        }

        .completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .stats {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Todo List App Component -->
    <app-root></app-root>

    <!-- OpenFlex Runtime -->
    <script src="../../runtime/openflex-runtime-browser.js"></script>

    <!-- Todo List App Component -->
    <script src="TodoListApp-component.js"></script>

    <script>
        console.log('✅ Todo List App loaded successfully!');
    </script>
</body>
</html>
