<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura - OpenFlex Neo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
    </style>
    <link rel="stylesheet" href="../runtime/neo-flex-classic-theme.css">
</head>
<body>
    <app-root></app-root>
    
    <script src="../runtime/openflex-runtime-browser.js"></script>
    <script src="TemperatureApp-component.js"></script>
    <script>console.log('✅ Conversor de Temperatura loaded!');</script>

    <script src="../runtime/mxml-source-viewer.js"></script>

    <script>
        // Inicializar viewer de source code MXML
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof MXMLSourceViewer !== 'undefined') {
                window.mxmlSourceViewer = new MXMLSourceViewer();
                window.mxmlSourceViewer.init('TemperatureApp.mxml');
            }
        });
    </script>
</body>
</html>
