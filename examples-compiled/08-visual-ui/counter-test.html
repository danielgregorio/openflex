<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App - OpenFlex Neo MXML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Neo Component Styles */
        .neo-application {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neo-vbox {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .neo-vbox.h-align-center {
            align-items: center;
        }

        .neo-vbox.v-align-middle {
            justify-content: center;
        }

        .neo-hbox {
            display: flex;
            flex-direction: row;
            gap: 8px;
        }

        .neo-hbox.h-align-center {
            justify-content: center;
        }

        .neo-panel {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            min-width: 400px;
        }

        .neo-panel-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .neo-panel-body {
            padding: 30px;
        }

        .neo-label {
            font-size: 16px;
            color: #333;
        }

        .neo-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .neo-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
        }

        .neo-button:active {
            transform: translateY(0);
        }

        .counter-display {
            font-size: 72px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .info-text {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <!-- Counter App Component -->
    <app-root></app-root>

    <!-- OpenFlex Runtime -->
    <script src="../../runtime/openflex-runtime-browser.js"></script>

    <!-- Counter App Component -->
    <script src="CounterApp-component.js"></script>

    <script>
        console.log('✅ Counter App loaded successfully!');
    </script>
</body>
</html>
