<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - OpenFlex</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        input:focus {
            border-color: #3498db !important;
        }

        .view-source-floating {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 1000;
            text-decoration: none;
            display: inline-block;
        }

        .view-source-floating:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
    </style>
    <link rel="stylesheet" href="../runtime/neo-flex-classic-theme.css">
</head>
<body>
    <a href="02-todo-list-visual.as4" target="_blank" class="view-source-floating">
        📄 Ver Código Fonte (.as4)
    </a>
    <div id="app"></div>
    <script src="02-todo-list-visual.js"></script>

    <script src="../runtime/mxml-source-viewer.js"></script>

    <script>
        // Inicializar viewer de source code MXML
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof MXMLSourceViewer !== 'undefined') {
                window.mxmlSourceViewer = new MXMLSourceViewer();
                window.mxmlSourceViewer.init('02todolistvisual.mxml');
            }
        });
    </script>
</body>
</html>
