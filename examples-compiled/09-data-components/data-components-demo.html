<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Components Demo - OpenFlex Neo</title>

    <!-- Tema Flex Classic -->
    <link rel="stylesheet" href="../../runtime/neo-flex-classic-theme.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #5A5A5A;
            font-family: Arial, Helvetica, sans-serif;
        }

        app-root {
            display: block;
        }
    </style>
</head>
<body>
    <app-root></app-root>

    <script src="../../runtime/openflex-runtime-browser.js"></script>
    <script src="DataComponentsDemo-component.js"></script>
    <script src="../../runtime/mxml-source-viewer.js"></script>

    <script>
        console.log('✅ Data Components Demo loaded!');
        console.log('📊 DataGrid, ComboBox, and List components active');

        // Inicializar viewer de source code
        document.addEventListener('DOMContentLoaded', () => {
            window.mxmlSourceViewer = new MXMLSourceViewer();
            window.mxmlSourceViewer.init('DataComponentsDemo.mxml');
        });
    </script>
</body>
</html>
